<!DOCTYPE html>
<HTML lang="en">
    <HEAD>
        <TITLE>HBNB</TITLE>
    </HEAD>
    <BODY>
        <H1>
             {% if number_n % 2 == 0 %}
             Number: {{ number_n }} is even
             {% else %}
             Number: {{ number_n }} is odd
             {% endif %}
        </H1>
    </BODY>
</HTML>
